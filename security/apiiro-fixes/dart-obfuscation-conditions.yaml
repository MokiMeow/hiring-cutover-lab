rules:
  - id: dart-obfuscation-conditions
    options:
      constant_propagation: false
    patterns:
      - pattern-regex: ^.{,401}$
      - pattern-not-inside: '...'
      - pattern-not: while (true) { ... }
      - pattern-either:
          - pattern: if ($VAR) { ... }
          - pattern: while ($VAR) { ... }
          - pattern: 'switch ($VAR) { case $CASE: ... }'
          - pattern: 'switch ($VAR) { default: ... }'
      - metavariable-regex:
          metavariable: $VAR
          # Match all non-literals, or the listed literals.
          regex: ^(?!.*(?<!['"`])\b(?!true|false|null)[a-zA-Z_!]).*$
    message: Obfuscation by spurious conditions.
    severity: WARNING
    languages:
      - dart
